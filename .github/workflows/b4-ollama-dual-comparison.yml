name: B4 identical 24-turn Gemma4 vs GPT-OSS 120B comparison

on:
  pull_request:
    paths:
      - ".github/workflows/b4-ollama-dual-comparison.yml"
      - "backend/tests/live_ollama_long_story_trial.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/b4-ollama-dual-comparison.yml"

permissions:
  contents: read

concurrency:
  group: b4-2026-10-20-gemma-gptoss-same-24
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        model_label: ["gemma4:31b-cloud", "gpt-oss:120b-cloud"]
    env:
      PYTHONPATH: backend:backend/tests
      LONG_STORY_COMPARISON: "1"
      LONG_STORY_MODEL_LABEL: ${{ matrix.model_label }}
      LONG_STORY_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify identical fixture and pinned model without provider requests
        run: |
          uv sync --locked --extra test
          python -m py_compile backend/tests/live_ollama_long_story_trial.py
          uv run --locked --extra test python backend/tests/live_ollama_long_story_trial.py

  gemma4-live:
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'ci(ollama): compare gemma4 and gptoss same 24 turns 2026-10-20') }}
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      LONG_STORY_COMPARISON: "1"
      LONG_STORY_MODEL_LABEL: gemma4:31b-cloud
      LONG_STORY_APPROVAL: OWNER_GEMMA_GPTOSS_SAME_24_2026_10_20
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra test
      - name: Read-only credit-gated Gemma4 24-turn roleplay test
        run: uv run --locked --extra test python backend/tests/live_ollama_long_story_trial.py

  gptoss-live:
    # Regardless of Gemma narration quality, independently test the second
    # model on the SAME actions. Never infer that a failed Gemma run is a GPT-OSS pass.
    if: >-
      ${{ always() && needs['offline-contract'].result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'ci(ollama): compare gemma4 and gptoss same 24 turns 2026-10-20') }}
    needs: [offline-contract, gemma4-live]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      LONG_STORY_COMPARISON: "1"
      LONG_STORY_MODEL_LABEL: gpt-oss:120b-cloud
      LONG_STORY_APPROVAL: OWNER_GEMMA_GPTOSS_SAME_24_2026_10_20
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra test
      - name: Read-only credit-gated GPT-OSS 120B 24-turn roleplay test
        run: uv run --locked --extra test python backend/tests/live_ollama_long_story_trial.py
