name: B4 owner-approved gpt-oss 120b story quality trial

on:
  pull_request:
    paths:
      - ".github/workflows/b4-gptoss120b-story-trial.yml"
      - "backend/tests/live_ollama_gptoss_three_turn_trial.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/b4-gptoss120b-story-trial.yml"

permissions:
  contents: read

concurrency:
  group: b4-owner-gptoss120b-three-turn-20261019
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Offline safety and pinned adapter verification
        env:
          PYTHONPATH: backend:backend/tests
          GPTOSS_DRY_RUN: "1"
        run: |
          uv sync --locked --extra test
          uv run --locked --extra test python backend/tests/live_ollama_gptoss_three_turn_trial.py

  owner-approved-live:
    # Real inference is NEVER run in a PR, rerun, or on an ordinary push.
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'ci(ollama): owner gpt-oss 120b three-round trial 2026-10-19') }}
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      PYTHONPATH: backend:backend/tests
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      GPTOSS_LIVE_APPROVAL: OWNER_GPTOSS120B_THREE_TURN_2026_10_19
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --locked --extra test
      - name: Credit-gated max-three gpt-oss 120b real Ollama Cloud turns
        run: uv run --locked --extra test python backend/tests/live_ollama_gptoss_three_turn_trial.py
