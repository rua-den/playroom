name: B4 owner long-story 24-round Ollama gpt-oss trial

on:
  pull_request:
    paths:
      - ".github/workflows/b4-ollama-long-story.yml"
      - "backend/tests/live_ollama_long_story_trial.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/b4-ollama-long-story.yml"

permissions:
  contents: read

concurrency:
  group: b4-2026-10-19-owner-long-story-24-packed
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Validate 24-turn bounded contract without secrets or network
        env:
          PYTHONPATH: backend:backend/tests
          LONG_STORY_DRY_RUN: "1"
        run: |
          uv sync --locked --extra test
          python -m py_compile backend/tests/live_ollama_long_story_trial.py
          uv run --locked --extra test python backend/tests/live_ollama_long_story_trial.py

  one-shot-live:
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && startsWith(github.event.head_commit.message, 'ci(ollama): packed long story 24 turns 2026-10-19') }}
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend:backend/tests
      LONG_STORY_APPROVAL: OWNER_LONG_STORY_24_TURNS_2026_10_19
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install pinned dependencies
        run: uv sync --locked --extra test
      - name: Credit-gated gpt-oss 120b 24-turn trial
        run: uv run --locked --extra test python backend/tests/live_ollama_long_story_trial.py
