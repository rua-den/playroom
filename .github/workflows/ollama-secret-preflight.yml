name: Ollama Cloud credential preflight (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ollama-secret-preflight.yml"

permissions:
  contents: read

jobs:
  auth-check:
    # Never expose credentials to pull_request code or untrusted forks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Authenticated, read-only model catalog query
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("OLLAMA_API_KEY", "")
          if not api_key:
              raise SystemExit("OLLAMA_API_KEY is missing in this repository's Actions secrets")
          req = urllib.request.Request(
              "https://ollama.com/v1/models",
              headers={"Authorization": "Bearer " + api_key, "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Ollama Cloud metadata endpoint returned HTTP {exc.code}; credential or access is not verified")
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit("Ollama Cloud metadata endpoint is unreachable; no inference was attempted")
          models = data.get("data", []) if isinstance(data, dict) else []
          identifiers = {entry.get("id") for entry in models if isinstance(entry, dict)}
          print("Authenticated GET /v1/models: PASS")
          # Print only exact public candidate IDs, never the full catalog.
          # Presence establishes availability, not starter eligibility or balance.
          for model in ("gpt-oss:120b", "gemma4", "gemma4:cloud", "gemma4:31b"):
              print(f"{model} listed in model catalog:", model in identifiers)
          print("Pricing, Free starter eligibility, account usage/balance: NOT established by this check")
          print("Paid inference requests sent: 0")
          PY
