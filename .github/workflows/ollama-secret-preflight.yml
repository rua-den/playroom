name: Ollama Cloud credential preflight (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ollama-secret-preflight.yml"

permissions:
  contents: read

jobs:
  auth-check:
    # Never expose credentials to pull_request code or untrusted forks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - name: Authenticated, read-only model catalog query
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ.get("OLLAMA_API_KEY", "")
          if not api_key:
              raise SystemExit("OLLAMA_API_KEY is missing in this repository's Actions secrets")
          req = urllib.request.Request(
              "https://ollama.com/v1/models",
              headers={"Authorization": "Bearer " + api_key, "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Ollama Cloud metadata endpoint returned HTTP {exc.code}; credential or access is not verified")
          except (urllib.error.URLError, TimeoutError) as exc:
              raise SystemExit("Ollama Cloud metadata endpoint is unreachable; no inference was attempted")
          models = data.get("data", []) if isinstance(data, dict) else []
          identifiers = {entry.get("id") for entry in models if isinstance(entry, dict)}
          print("Authenticated GET /v1/models: PASS")
          # Print only exact public candidate IDs, never the full catalog.
          # Presence establishes availability, not starter eligibility or balance.
          for model in ("gpt-oss:120b", "gemma4", "gemma4:cloud", "gemma4:31b"):
              print(f"{model} listed in model catalog:", model in identifiers)
          print("Pricing, Free starter eligibility, account usage/balance: NOT established by this check")
          print("Paid inference requests sent: 0")
          PY

      - name: Read-only included and purchased credit buckets (no balances logged)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from decimal import Decimal, InvalidOperation

          key = os.environ.get("OLLAMA_API_KEY", "")
          if not key:
              raise SystemExit("OLLAMA_API_KEY is missing; no billing data accessed")
          # Documented endpoint: https://docs.ollama.com/api/balance.
          # GET ONLY: do not infer a purchased-credit lockout or issue inference.
          req = urllib.request.Request(
              "https://ollama.com/api/balance",
              headers={"Authorization": "Bearer " + key, "Accept": "application/json"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"GET /api/balance: UNAVAILABLE (HTTP {exc.code}); spending source remains UNKNOWN")
              raise SystemExit(0)
          except (urllib.error.URLError, TimeoutError, ValueError):
              print("GET /api/balance: UNAVAILABLE; spending source remains UNKNOWN")
              raise SystemExit(0)
          if not isinstance(payload, dict):
              print("GET /api/balance: UNKNOWN response; spending source remains UNKNOWN")
              raise SystemExit(0)

          def bucket(value):
              try:
                  amount = Decimal(str(value))
                  if not amount.is_finite() or amount < 0:
                      return "UNKNOWN"
                  return "POSITIVE" if amount > 0 else "ZERO"
              except (InvalidOperation, TypeError, ValueError):
                  return "UNKNOWN"

          included = payload.get("included")
          purchased = payload.get("purchased")
          if isinstance(included, dict) and "balance_usd" in included:
              included_status = bucket(included["balance_usd"])
          elif isinstance(included, dict) and "session" in included and "weekly" in included:
              included_status = "LEGACY_PERCENT_LIMITS (not a USD balance)"
          else:
              included_status = "UNKNOWN"
          purchased_status = bucket(purchased.get("balance_usd")) if isinstance(purchased, dict) else "UNKNOWN"
          # Only classifications: NEVER print numeric balances, raw JSON,
          # tokens, auth headers, the account identity or private prompts.
          print("GET /api/balance: available")
          print("Included credits:", included_status)
          print("Purchased credits:", purchased_status)
          print("Provider-enforced purchased-credit lockout: NOT VERIFIED")
          print("Balance is a read-only point-in-time snapshot, not a spend reservation")
          print("Chat completions sent: 0")
          PY
