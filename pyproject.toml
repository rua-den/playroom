[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "playroom"
version = "0.1.0"
description = "Private, branch-aware Vietnamese roleplay web app"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.143,<1",
  "pydantic>=2.11.7,<3",
  "uvicorn>=0.34.3,<1",
  "httpx2>=2.13,<3",
  "jsonschema>=4.23,<5",
]

[project.scripts]
playroom-owner = "playroom.auth:main"
playroom-demo = "playroom.demo:main"

[project.optional-dependencies]
test = ["pytest>=8.4.1,<9"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
playroom = ["migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
